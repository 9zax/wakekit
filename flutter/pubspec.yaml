name: wakekit
description: >-
  Train a wake word for any language with TTS, run it on-device in Flutter. The same frozen
  ONNX models as the wakekit npm package — no cloud, no network call.
version: 0.1.4
homepage: https://github.com/9zax/wakekit
repository: https://github.com/9zax/wakekit
issue_tracker: https://github.com/9zax/wakekit/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

platforms:
  android:
  ios:
  linux:
  windows:

dependencies:
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.8.3
  record: ^7.1.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  assets:
    - assets/models/
