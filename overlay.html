<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wakekit overlay</title>
  <style>
    /* Transparent always-on-top strip: just the pill, centered at the bottom of the window. */
    html, body { margin: 0; background: transparent; overflow: hidden; }
    /* Center the pill in the window instead of margin-ing it from the top: the pill is ~64px tall
       and the window 76px, so a top margin pushed its rounded bottom past the edge, where it was
       clipped flat. Centred, the slack sits above and below and stays transparent. */
    body { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .pill {
      display: flex; align-items: center; gap: 10px;
      width: fit-content; max-width: 92vw;
      padding: 10px 18px 10px 10px; border-radius: 999px;
      background: rgba(10, 10, 10, 0.88); color: #fafafa;
      font: 15px/1.4 'Space Mono', ui-monospace, monospace;
      /* No box-shadow: the window is only 76px tall, so the blur ran past its edge and got cut off
         in a straight line — a square smudge around the pill. Nothing paints outside the pill. */
    }
    .pill canvas { width: 44px; height: 44px; flex-shrink: 0; }
    .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="pill"><canvas id="orb"></canvas><span id="cap"></span></div>
  <script type="module" src="/demo/overlay.ts"></script>
</body>
</html>
