<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>wakekit result</title>
  <style>
    /* A floating result card. The window is fully transparent and this background IS the card —
       that is what makes the corners round: a native material behind it can only be rounded via a
       private API that no longer takes, so it showed through as a square slab. */
    * { box-sizing: border-box; margin: 0; }
    /* The card background MUST live on .panel, not on html/body: a background set on either of
       those is propagated to the window canvas, which is painted as a plain rectangle and ignores
       border-radius — that is what kept the corners square. Both stay transparent, and nothing
       (no padding, no shadow) paints outside .panel, so the window is exactly the rounded card. */
    html, body { background: transparent; }
    body {
      font: 400 13px/1.5 -apple-system, "SF Pro Text", "Noto Sans Thai", sans-serif;
      color: #fff; user-select: none; overflow: hidden;
    }
    .panel {
      /* Opaque. Any translucency here lets whatever sits behind bleed through as grey — over a
         light window that reads as dirt, not as depth, and there is no blur to hide it. */
      background: #1c1c1e;
      border-radius: 18px;
      padding: 0 14px 14px;
      overflow: hidden;
    }
    html[lang="th"] .en, html[lang="en"] .th { display: none; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 2px; }
    .bar h1 { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar button {
      width: 22px; height: 22px; flex-shrink: 0; border: 0; border-radius: 50%; cursor: pointer;
      background: rgba(255, 255, 255, 0.16); color: #fff; font-size: 11px; line-height: 1;
    }
    .bar button:hover { background: rgba(255, 255, 255, 0.28); }
    .card { background: rgba(255, 255, 255, 0.09); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; overflow: hidden; }
    section[hidden] { display: none; }

    /* weather — the reference widget: place, big temperature, one condition line, next hours */
    #weather { padding: 14px 16px 12px; }
    #wx-place { font-size: 15px; font-weight: 600; }
    #wx-temp { font-size: 44px; font-weight: 300; line-height: 1.1; letter-spacing: -0.02em; }
    #wx-cond { display: flex; align-items: center; gap: 7px; font-size: 13px; color: rgba(255, 255, 255, 0.85); }
    #wx-hours { display: flex; gap: 6px; margin-top: 12px; }
    #wx-hours div { flex: 1; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.6); }
    #wx-hours b { display: block; font-size: 13px; font-weight: 500; color: #fff; margin-top: 2px; }
    #wx-hours .ic { display: block; font-size: 15px; line-height: 1.4; }

    /* video — our own player on a direct stream, 16:9, clipped by the card's own radius */
    #video video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; }

    /* search — one row per result, the whole row clickable */
    #search a {
      display: block; padding: 9px 12px; color: #fff; text-decoration: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer;
    }
    #search a:first-child { border-top: 0; }
    #search a:hover { background: rgba(255, 255, 255, 0.09); }
    #search b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #search i {
      display: block; font-style: normal; font-size: 11.5px; color: rgba(255, 255, 255, 0.55);
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }

    /* news — one story per window, the whole card opens it. Fixed height: these windows are tiled
       edge to edge, so a card that grew with its text would sit on top of its neighbour. */
    #news { cursor: pointer; position: relative; }
    #news:hover { background: rgba(255, 255, 255, 0.13); }
    #news-img { display: block; width: 100%; height: 108px; object-fit: cover; background: #2c2c2e; }
    #news-img[hidden] { display: none; }
    #news-body { padding: 10px 12px; padding-right: 40px; } /* room for the read button */
    /* the small "read it" button, bottom-right of the story */
    #news-open {
      position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px;
      border: 0; border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1;
      background: rgba(255, 255, 255, 0.16); color: #fff;
    }
    #news-open:hover { background: rgba(255, 255, 255, 0.34); }
    #news b {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      font-size: 13px; font-weight: 600; line-height: 1.35;
    }
    #news i {
      display: block; font-style: normal; margin-top: 6px;
      font-size: 11px; color: rgba(255, 255, 255, 0.55);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* text — a claude reply, in full this time */
    /* px, not vh: the window's height is set FROM this content, so a vh cap would feed back on
       itself and shrink the card a little more on every reply. */
    #text { padding: 12px 14px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; user-select: text; }

    /* the fallback every failed lookup lands on */
    #fail { padding: 14px 16px; }
    #fail p { color: rgba(255, 255, 255, 0.6); margin-bottom: 10px; }
    #fail button {
      border: 0; border-radius: 8px; padding: 7px 14px; cursor: pointer;
      background: rgba(255, 255, 255, 0.9); color: #111; font: 600 13px/1.5 inherit;
    }
  </style>
</head>
<body>
 <div class="panel" id="panel">
  <div class="bar" data-tauri-drag-region>
    <h1 id="title" data-tauri-drag-region></h1>
    <button id="close" title="close / ปิด">✕</button>
  </div>

  <section id="weather" class="card" hidden>
    <div id="wx-place"></div>
    <div id="wx-temp"></div>
    <div id="wx-cond"></div>
    <div id="wx-hours"></div>
  </section>

  <section id="video" class="card" hidden><video controls autoplay playsinline></video></section>

  <section id="search" class="card" hidden></section>

  <section id="news" class="card" hidden>
    <img id="news-img" hidden alt="" />
    <div id="news-body"><b id="news-title"></b><i id="news-meta"></i></div>
    <button id="news-open" title="อ่านข่าว / read">↗</button>
  </section>

  <section id="text" class="card" hidden></section>

  <section id="fail" class="card" hidden>
    <p><span class="en">Couldn't fetch that.</span><span class="th">ดึงข้อมูลไม่ได้</span></p>
    <button id="open-browser"><span class="en">Open in browser</span><span class="th">เปิดในเบราว์เซอร์</span></button>
  </section>
 </div>

  <script type="module" src="/demo/pip.ts"></script>
</body>
</html>
